[workspace]
members = [
  "crates/ferrite-cli",
  "crates/ferrite-builder",
  "crates/ferrite-client-bundler",
  "crates/ferrite-core",
  "crates/ferrite-dev-server",
  "crates/ferrite-page-renderer",
  "crates/ferrite-node",
  "crates/ferrite-protocol",
  "crates/ferrite-protocol-wasm",
  "crates/ferrite-router",
  "crates/ferrite-ssr",
]
resolver = "3"

[workspace.package]
edition = "2024"
homepage = "https://github.com/integrate-your-mind/ferrite"
license = "MIT"
repository = "https://github.com/integrate-your-mind/ferrite"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.18"
flate2 = "1"
getrandom = "0.2"
httparse = "1.10.1"
rustix = { version = "1", features = ["fs"] }
libc = "0.2"
process-wrap = { version = "8.2.1", default-features = false, features = ["job-object", "std", "tracing"] }
sha2 = "0.11"
signal-hook = { version = "0.3", default-features = false }
