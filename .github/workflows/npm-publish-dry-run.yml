name: npm package verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/npm-publish-dry-run.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "packages/**"
      - "scripts/verify-npm-packages.mjs"
      - "scripts/verify-npm-packages.test.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    paths:
      - ".github/workflows/npm-publish-dry-run.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "packages/**"
      - "scripts/verify-npm-packages.mjs"
      - "scripts/verify-npm-packages.test.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  verify-npm-packages:
    name: Verify npm package tarballs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm package verifier tests
        run: pnpm test:release

      - name: Verify npm package tarballs and install smoke
        run: pnpm release:verify:npm

      - name: Upload npm package verification report
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-verification-report
          path: dist/npm-packages
          if-no-files-found: error
