map $http_host $ferrite_authority_allowed {
  default 0;
  app.example.com 1;
}

map $request $ferrite_request_target_allowed {
  default 0;
  "~*^[A-Z]+ /(?:[^/ ][^ ]*)? HTTP/" 1;
  "~*^[A-Z]+ https://app\.example\.com(?:/|[?# ])" 1;
}

server {
  listen 443 ssl;
  http2 on;
  server_name app.example.com;

  ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

  client_max_body_size 16k;

  # Keep this value aligned with the map key above. The map checks the raw
  # Host authority without a port; $host also checks absolute-form targets.
  if ($host != $server_name) {
    return 421;
  }
  if ($ferrite_authority_allowed = 0) {
    return 421;
  }
  if ($ferrite_request_target_allowed = 0) {
    return 421;
  }

  # Scrape Ferrite directly on the private upstream from a local collector.
  location = /__ferrite/metrics {
    return 404;
  }

  location / {
    proxy_http_version 1.1;
    proxy_request_buffering on;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_set_header Expect "";
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    proxy_pass http://127.0.0.1:3000;
  }
}
